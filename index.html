<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prakash Lal, Senior Lead Software Engineer in Mumbai. Engineering leadership, front-end engineering and UX.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prakash Lal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@400;600;800&display=swap">
<link rel="stylesheet" id="fontlink" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap">
<style>
/* Layout: one page, two views. The site is a Bauhaus construction kit on a blueprint sheet, rendered from editable content; #admin is a calm two-pane control room. Site tokens are rewritten live by the theme editor; panel tokens stay fixed so it is always legible. */
:root{
  --bg:#0A1830;--surface:#0F2142;--deep:#06101F;--text:#E9EEF6;--soft:#93A6C4;--line:#2A4A7A;
  --c1:#3D63FF;--c2:#FF6A3D;--c3:#FFC83A;--glow:#FFB547;
  --on-c1:#fff;--on-c2:#0A1830;--on-c3:#0A1830;--on-deep:#E9EEF6;--on-text:#0A1830;
  --r:24px;
  --fd:"Unbounded","Arial Black",sans-serif;
  --fb:"Manrope","Helvetica Neue",Arial,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  /* control panel (fixed) */
  --a-bg:#0D1117;--a-panel:#151B24;--a-raise:#1C2430;--a-line:#2A3442;--a-text:#E6EAF0;--a-soft:#8B97A8;--a-accent:#5B7CFF;--a-ok:#3FB97A;--a-warn:#F2A541;--a-bad:#F06A6A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
body.adm{background:var(--a-bg);color:var(--a-text)}
body.adm::before{background:var(--a-bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.02;text-wrap:balance}
p{margin:0}
img{max-width:100%}

/* ================= SITE ================= */
#site em{font-style:normal;color:var(--c3)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr);position:relative}
.m{font-family:var(--fm);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.s-h2{font-size:clamp(32px,5.6vw,64px);font-weight:800;letter-spacing:-.03em}
.plane{position:fixed;inset:-50% -10%;pointer-events:none;z-index:0;will-change:transform}
.plane.p1{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.22}
.plane.p2{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;opacity:.08}
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 18%,transparent),transparent 60%);top:-20vmax;right:-20vmax;will-change:transform}
.solids{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.solids .shp{position:absolute;opacity:.85;will-change:transform}
#site main,#site header,#site footer{position:relative;z-index:2}
.shp{display:block}
.shp.circle{border-radius:50%}
.shp.diamond{transform:rotate(45deg)}
.shp.ring{border-radius:50%;background:transparent!important}
.shp.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}
.shp.hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.shp.half{border-radius:999px 999px 0 0}
.shp.pill{border-radius:999px}

.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;padding-left:var(--gl);padding-right:var(--gr)}
.nav-in{max-width:1200px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 20px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:999px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--fd);font-weight:800;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo i{display:inline-flex;gap:3px;flex:none}
.logo i .shp{width:10px;height:10px}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;transition:background .2s}
.nav ul a:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}
.pill-btn{background:var(--text);color:var(--on-text);text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;white-space:nowrap}
@media (max-width:820px){.nav ul{display:none}}

.hero{position:relative;padding-block:130px 60px;min-height:min(860px,100svh);display:flex;align-items:center}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero .wrap{z-index:2;width:100%}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.stage-wrap{position:relative}
#stage{width:100%;aspect-ratio:1/1;max-width:100%;position:relative;touch-action:pan-y}
#stage canvas{width:100%!important;height:100%!important;display:block}
.stage-fallback{position:absolute;inset:8%}
.stage-fallback .shp{position:absolute}
.photo{position:absolute;left:0;bottom:4%;width:38%;aspect-ratio:1/1;overflow:hidden;border:4px solid var(--text);background:var(--surface);z-index:3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.circle{border-radius:50%}
.photo.square{border-radius:var(--r)}
.photo.hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0}
.photo.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:999px;background:var(--surface);font-family:var(--fm);font-size:12px;letter-spacing:.04em;max-width:100%}
.eyebrow b{width:8px;height:8px;border-radius:50%;background:#1DB954;display:block;flex:none}
.h-name{font-size:clamp(50px,9vw,128px);font-weight:800;letter-spacing:-.05em;line-height:.9;margin-top:26px;overflow-wrap:anywhere}
.h-name .ln{display:block;overflow:hidden;padding-bottom:.04em}
.h-name .ln span{display:inline-block;animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.h-name .ln:nth-child(2) span{animation-delay:.1s}
.h-name .dot{color:var(--c2)}
@keyframes up{from{transform:translateY(105%) rotate(4deg)}to{transform:none}}
.h-role{font-size:clamp(18px,2vw,22px);margin-top:24px;max-width:34ch;font-weight:500}
.h-role em{border-bottom:3px solid var(--c3);font-weight:700}
.h-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.b{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:calc(var(--r)*.55);font-weight:700;text-decoration:none;font-size:15px;border:2px solid var(--text);background:var(--surface);color:var(--text);box-shadow:4px 4px 0 var(--text);transition:transform .15s,box-shadow .15s;cursor:pointer;font-family:var(--fb)}
.b:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--text)}
.b:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--text)}
.b.pri{background:var(--c1);color:var(--on-c1)}
.h-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:40px}
.h-meta div{display:flex;flex-direction:column}
.h-meta b{font-family:var(--fd);font-size:22px}
@media (max-width:880px){.hero-grid{grid-template-columns:1fr}.stage-wrap{max-width:440px;margin:0 auto;order:-1;width:100%}.hero{padding-top:100px}}

.belt{background:var(--text);color:var(--on-text);padding-block:18px;overflow:hidden;transform:rotate(1.2deg) scale(1.03);position:relative;z-index:3}
.belt-t{display:flex;gap:40px;width:max-content;animation:belt 34s linear infinite;align-items:center}
.belt-t span{font-family:var(--fd);font-size:clamp(20px,3vw,32px);font-weight:600;white-space:nowrap}
.belt-t .shp{width:18px;height:18px;flex:none}
@keyframes belt{to{transform:translateX(-50%)}}

.sec{padding-block:clamp(90px,13vw,150px);position:relative}
.sec.tight{padding-top:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:52px}
.head .m{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.head .m::before{content:"";width:12px;height:12px;background:var(--c1);border-radius:50%}
.head .lede{max-width:40ch;color:var(--soft)}

.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-flow:dense;gap:16px}
.tile{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:28px;position:relative;overflow:hidden;min-width:0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile.story{grid-column:span 4;grid-row:span 2;display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.tile.story h3{font-size:clamp(22px,2.6vw,32px);font-weight:600;line-height:1.2;letter-spacing:-.02em}
.tile.story h3 em{color:var(--c1)!important}
.tile.story .body{color:var(--soft);max-width:60ch;display:flex;flex-direction:column;gap:12px}
.tile.stat{grid-column:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:16px;border-color:transparent;min-height:150px}
.tile.stat .n{font-family:var(--fd);font-size:clamp(44px,6vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tile.stat .m{color:inherit;opacity:.75}
.tile.stat .shp{position:absolute;right:-20px;bottom:-20px;width:110px;height:110px;opacity:.25}
.tile.quote{grid-column:span 3;background:var(--deep);color:var(--on-deep);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.tile.quote p{font-family:var(--fd);font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.25;letter-spacing:-.02em}
.tile.quote .m{color:inherit;opacity:.6}
.tile.facts{grid-column:span 3}
.facts dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;margin:16px 0 0}
.facts dt{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding-top:2px}
.facts dd{margin:0;font-weight:600}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.story,.tile.quote,.tile.facts{grid-column:span 2}.tile.stat{grid-column:span 1}.tile.story{grid-row:auto}}

.cube-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.scene{height:420px;perspective:1100px;display:grid;place-items:center;cursor:grab;touch-action:pan-y;user-select:none}
.scene:active{cursor:grabbing}
.cube{--s:260px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border:2px solid var(--text);border-radius:calc(var(--r)*.75);padding:22px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face h3{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.face p{font-size:14px;font-weight:500}
.face .m{color:inherit;opacity:.7}
.face .shp{position:absolute;right:-18px;top:-18px;width:80px;height:80px;opacity:.25;background:currentColor}
.skill-list{display:flex;flex-direction:column}
.skill{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;padding-block:18px;border:0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);cursor:pointer;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.skill:last-child{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.skill .shp{width:22px;height:22px;margin-top:4px;transition:transform .4s}
.skill h4{font-family:var(--fd);font-size:18px;font-weight:600}
.skill p{color:var(--soft);font-size:15px;margin-top:6px}
.skill.on .shp{transform:rotate(90deg) scale(1.15)}
.skill.on h4{color:var(--c1)}
@media (max-width:880px){.cube-grid{grid-template-columns:1fr}.scene{height:340px}.cube{--s:210px}}

.stack{position:relative;display:flex;flex-direction:column;gap:28px;padding-bottom:40px}
.card{position:sticky;top:calc(100px + var(--i)*18px);border-radius:calc(var(--r)*1.15);border:2px solid var(--text);padding:clamp(24px,4vw,44px);min-height:360px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;transform-origin:50% 0;will-change:transform;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5);overflow:hidden}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card .yr{font-family:var(--fm);font-size:13px;padding:6px 12px;border:1.5px solid currentColor;border-radius:999px;font-variant-numeric:tabular-nums}
.card .idx{font-family:var(--fm);font-size:13px;opacity:.7}
.card h3{font-size:clamp(24px,3.4vw,42px);font-weight:800;letter-spacing:-.03em;margin-top:26px;line-height:1.05}
.card .org{font-weight:700;font-size:18px;margin-top:12px}
.card .org small{font-weight:500;opacity:.75;font-size:14px}
.card ul{margin:18px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:56ch}
.card .now{display:inline-block;font-family:var(--fm);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--c2);color:var(--on-c2);padding:4px 8px;border-radius:6px;vertical-align:middle}
.card .art{position:relative;min-height:220px}
.card .art .shp{position:absolute}
.card .art img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);position:absolute;inset:0;border:2px solid currentColor}
@media (max-width:760px){.card{grid-template-columns:1fr;min-height:0}.card .art{display:none}.card .art.has-img{display:block;min-height:180px;order:-1}}

.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.proj{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .3s,box-shadow .3s}
.proj:hover{transform:translateY(-6px);box-shadow:8px 8px 0 var(--text)}
.proj .pv{aspect-ratio:16/10;position:relative;overflow:hidden;display:grid;place-items:center}
.proj .pv img{width:100%;height:100%;object-fit:cover;display:block}
.proj .pv .shp{width:38%;height:auto;aspect-ratio:1/1;background:currentColor;opacity:.5}
.proj .pb{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.proj h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
.proj p{color:var(--soft);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.tags span{font-family:var(--fm);font-size:11px;padding:4px 10px;border:1px solid color-mix(in srgb,var(--line) 90%,transparent);border-radius:99px;color:var(--soft)}
.proj a.go{font-weight:700;color:var(--c1);text-decoration:none}

.edu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.edu .t{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:calc(var(--r)*.9);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .3s,box-shadow .3s}
.edu .t:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:8px 8px 0 var(--text)}
.edu .t h4{font-family:var(--fb);font-size:17px;font-weight:700;line-height:1.35}
.edu .t p{color:var(--soft);font-size:14px}
.edu .t .yr{font-family:var(--fm);font-size:12px;color:var(--c1);font-variant-numeric:tabular-nums}
.edu .t .shp{width:36px;height:36px}
.lang{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px;align-items:center}
.lang span.ch{font-family:var(--fd);font-weight:600;font-size:20px;padding:10px 20px;border-radius:999px;border:2px solid transparent}
@media (max-width:820px){.edu{grid-template-columns:1fr}}

.contact-box{background:var(--deep);color:var(--on-deep);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:calc(var(--r)*1.5);padding:clamp(32px,6vw,72px);position:relative;overflow:hidden}
.contact-box h2{font-size:clamp(36px,7vw,92px);letter-spacing:-.04em;max-width:13ch;position:relative}
.contact-box .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:44px;position:relative;z-index:2}
.mailbox{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:18px;border-radius:18px;background:color-mix(in srgb,currentColor 8%,transparent);border:1px solid color-mix(in srgb,currentColor 20%,transparent)}
.mailbox code{font-family:var(--fm);font-size:clamp(14px,2vw,18px);user-select:all;word-break:break-all}
.mailbox .b{padding:10px 16px;font-size:13px;box-shadow:3px 3px 0 var(--c3);border-color:var(--c3)}
.out{display:flex;flex-direction:column;gap:10px}
.out a{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:16px;border:1px solid color-mix(in srgb,currentColor 20%,transparent);text-decoration:none;font-weight:700;font-size:17px;transition:background .25s,color .25s,transform .25s}
.out a:hover{background:var(--text);color:var(--on-text);transform:translateX(6px)}
.contact-box .orb{position:absolute;pointer-events:none}
@media (max-width:820px){.contact-box .row{grid-template-columns:1fr}}
.foot{padding-block:30px}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.rv{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.rv.wait{transform:translateY(40px) scale(.97);opacity:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--a-text);color:#0D1117;font-weight:700;padding:12px 20px;border-radius:14px;z-index:200;transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);font-family:var(--fb)}
.toast.on{transform:translate(-50%,0)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:#0D1117;color:#E6EAF0;border:1px solid #2A3442;font-family:"Manrope",sans-serif;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.fab:hover{background:#1C2430}
.pbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:95;background:#0D1117;color:#E6EAF0;border-bottom:1px solid #2A3442;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-family:"Manrope",sans-serif;font-size:14px}
.pbar ~ #siteInner .nav{top:calc(env(safe-area-inset-top,0px) + 54px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv.wait{opacity:1;transform:none}
}

/* ================= CONTROL PANEL ================= */
#admin{font-family:"Manrope",sans-serif;color:var(--a-text);min-height:100vh}
#admin h1,#admin h2,#admin h3{font-family:"Manrope",sans-serif;letter-spacing:-.01em}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-left:var(--gl);padding-right:var(--gr);background:radial-gradient(800px 500px at 80% -10%,rgba(91,124,255,.18),transparent 60%),var(--a-bg)}
.gate-card{width:100%;max-width:420px;background:var(--a-panel);border:1px solid var(--a-line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.gate-card .brand{display:flex;align-items:center;gap:10px;font-weight:800}
.gate-card .brand .shp{width:12px;height:12px}
.gate-card h1{font-size:24px;font-weight:800}

  const bg=type==="ring"?`border:${Math.max(3,size*.12)}px solid ${color};`:`background:${color};`;
  return `<span class="shp ${type}" style="width:${w}px;height:${h}px;${bg}${extra}"></span>`;
}

function applyTheme(t){
  const r=document.documentElement.style;
  ["bg","surface","deep","text","soft","line","c1","c2","c3","glow"].forEach(k=>r.setProperty("--"+k,t[k]));
  ["c1","c2","c3","deep","text","surface"].forEach(k=>r.setProperty("--on-"+k,onColor(t[k])));
  r.setProperty("--r",(+t.radius||0)+"px");
  r.setProperty("--fd",`"${t.fontDisplay}","Arial Black",sans-serif`);
  r.setProperty("--fb",`"${t.fontBody}","Helvetica Neue",Arial,sans-serif`);
  const fams=[FONTS_D[t.fontDisplay],FONTS_B[t.fontBody]].filter(Boolean).map(f=>"family="+f).join("&");
  const href="https://fonts.googleapis.com/css2?"+fams+"&display=swap";
  const l=$("#fontlink");if(l.getAttribute("href")!==href)l.setAttribute("href",href);
}

   ============================================================ */
const enc=s=>new TextEncoder().encode(s);
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const ITER=310000;
async function keyFrom(pw,salt,iter){const base=await crypto.subtle.importKey("raw",enc(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unhex(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sealAuth(c,username,password,tok){const salt=hex(crypto.getRandomValues(new Uint8Array(16))),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await keyFrom(password,salt,ITER);const data=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc(JSON.stringify({username,token:tok})));
  return {v:1,owner:c.owner,repo:c.repo,branch:c.branch,salt,iter:ITER,iv:hex(iv),data:hex(data),updatedAt:new Date().toISOString()}}
async function openAuth(a,password){const k=await keyFrom(password,a.salt,a.iter||ITER);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unhex(a.iv)},k,unhex(a.data));return JSON.parse(new TextDecoder().decode(pt))}
function b64FromBytes(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const b64Text=t=>b64FromBytes(enc(t));
const textB64=b=>new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function api(c,tok,path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`,{...opts,cache:"no-store",
    headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok,"X-GitHub-Api-Version":"2022-11-28",...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
  return r.status===204?null:r.json()}
async function getFile(c,tok,p){try{const j=await api(c,tok,`/contents/${p}?ref=${encodeURIComponent(c.branch)}`);return{sha:j.sha,content:j.content}}
  catch(e){if(e.status===404)return null;throw e}}
async function putFile(c,tok,p,b64,msg,sha){const body={message:msg,content:b64,branch:c.branch};if(sha)body.sha=sha;
  const j=await api(c,tok,`/contents/${p}`,{method:"PUT",body:JSON.stringify(body)});return j.content.sha}
function ghErr(e){if(!e)return "unknown error";
  if(e.status===401)return "GitHub rejected the token. It may have expired; add a new one under Account & login.";
  if(e.status===403)return "The token can't write to this repository. Give it Contents: Read and write access.";
  if(e.status===404)return "Repository or branch not found. Check the owner, repository, branch and the token's repository access.";
  if(e.status===409||e.status===422)return "The file changed on GitHub since it was loaded. Press Save again.";
  if(e instanceof TypeError)return "Couldn't reach GitHub. Check your connection.";
  return e.message||"unknown error"}
function detectRepo(){const m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return{owner:"",repo:"",branch:"main"};
  const seg=location.pathname.split("/").filter(Boolean)[0];return{owner:m[1],repo:seg&&!/\.html?$/i.test(seg)?seg:m[1]+".github.io",branch:"main"}}
function restoreSession(){try{const s=JSON.parse(sessionStorage.getItem("pl_gh")||"null");if(s&&s.token&&cfg){token=s.token;adminUser=s.username;authed=true}}catch(e){}}
function keepSession(){try{sessionStorage.setItem("pl_gh",JSON.stringify({token,username:adminUser}))}catch(e){}}
function dropSession(){try{sessionStorage.removeItem("pl_gh")}catch(e){}}
function signOut(){authed=false;token=null;adminUser=null;remoteLoaded=false;dropSession();location.hash=""}
async function loadRemote(){const f=await getFile(cfg,token,"content.json");contentSha=f?f.sha:null;
  if(f){try{saved=merge(DEFAULT,JSON.parse(textB64(f.content)))}catch(e){}}
  if(!dirty)draft=clone(saved);remoteLoaded=true}

function renderAdmin(){

function renderSetup(){
  const d=detectRepo();
  gate(`<h1>Set up your control panel</h1><p class="sub">Connect this site to its GitHub repository and choose your login. You only do this once.</p>
    <form id="setupF" class="list" autocomplete="off">
    <div class="grid2"><div class="f"><label for="so_o">GitHub username</label><input class="in" id="so_o" required></div><div class="f"><label for="so_r">Repository</label><input class="in" id="so_r" required></div></div>
    <div class="f"><label for="so_b">Branch</label><input class="in" id="so_b" required></div>
    <div class="f"><label for="so_t">GitHub access token</label><input class="in" id="so_t" type="password" required autocomplete="off" spellcheck="false">
      <span class="hint">Create a fine-grained token at github.com → Settings → Developer settings → Fine-grained tokens. Give it access to this repository only, with Contents: Read and write.</span></div>
    <div class="f"><label for="su">Panel username</label><input class="in" id="su" required minlength="3" autocomplete="username"></div>
    <div class="grid2"><div class="f"><label for="sp">Panel password</label><input class="in" id="sp" type="password" required minlength="10" autocomplete="new-password"></div>
    <div class="f"><label for="sp2">Confirm password</label><input class="in" id="sp2" type="password" required autocomplete="new-password"></div></div>
    <span class="hint">Use at least 10 characters. Your password encrypts the token, so a long, unique one keeps the site safe.</span>
    <p class="err" id="serr"></p><button class="abtn pri" type="submit">Connect and create login</button></form>`);
  $("#so_o").value=d.owner;$("#so_r").value=d.repo;$("#so_b").value=d.branch;
  $("#setupF").onsubmit=async e=>{e.preventDefault();const er=$("#serr");er.textContent="";
    const c={owner:$("#so_o").value.trim(),repo:$("#so_r").value.trim(),branch:$("#so_b").value.trim()||"main"},tok=$("#so_t").value.trim(),u=$("#su").value.trim(),p=$("#sp").value,p2=$("#sp2").value;
    if(u.length<3){er.textContent="Panel username needs at least 3 characters.";return}
    if(p.length<10){er.textContent="Password needs at least 10 characters.";return}
    if(p!==p2){er.textContent="The passwords don't match.";return}
    const b=$("#setupF button");b.disabled=true;b.textContent="Connecting…";
    try{
      await api(c,tok,"");
      const existing=await getFile(c,tok,"auth.json");
      if(existing){er.textContent="A login already exists for this site. GitHub Pages may still be publishing it; reload in a minute and sign in.";b.disabled=false;b.textContent="Connect and create login";return}
      const a=await sealAuth(c,u,p,tok);
      await putFile(c,tok,"auth.json",b64Text(JSON.stringify(a,null,2)),"Set up site control panel login");
      cfg=a;token=tok;adminUser=u;authed=true;keepSession();
      const cf=await getFile(c,tok,"content.json");
      if(!cf){contentSha=await putFile(c,tok,"content.json",b64Text(JSON.stringify(saved,null,2)),"Add site content");}
      toast("Connected. Your login is saved in the repository");renderAdmin();
    }catch(x){er.textContent=ghErr(x);b.disabled=false;b.textContent="Connect and create login"}};
}
function renderLogin(){
  gate(`<h1>Sign in</h1><p class="sub">Enter your control panel username and password.</p>

}

function updStatus(){const s=$("#st");if(!s)return;s.className="st"+(dirty?" dirty":"");s.innerHTML=`<i></i>${dirty?"Unsaved changes":"All changes saved"}`;const b=$("#saveB");if(b)b.disabled=!dirty||saving}
function renderPanel(){
  const vis=id=>draft.sections.find(s=>s.id===id);
  adminRoot.innerHTML=`<div class="shell"><aside class="side">${brandHTML}${CAT_GROUPS.map(([g,cs])=>`<div class="grp">${g}</div>${cs.map(([id,l,ic])=>{const s=vis(id);
    return `<button class="nav-b${id===currentCat?" on":""}" data-cat="${id}" type="button"><span class="ico">${ic}</span>${l}${s&&!s.visible?'<span class="off">hidden</span>':""}</button>`}).join("")}`).join("")}</aside>
    <div class="mainp"><div class="topbar"><div style="min-width:0"><h2 id="catT"></h2><span class="st" id="st"></span></div>
    <div class="acts"><a class="abtn ghost" href="#">View live site</a><button class="abtn" id="pvB" type="button">Preview</button><button class="abtn" id="discB" type="button">Discard</button><button class="abtn pri" id="saveB" type="button">Save &amp; publish</button></div></div>
    <div class="content" id="cnt"></div></div></div>`;
  $$(".nav-b",adminRoot).forEach(b=>b.onclick=()=>{currentCat=b.dataset.cat;renderPanel();scrollTo(0,0)});
  $("#pvB").onclick=()=>{preview=true;route();scrollTo(0,0)};
  $("#saveB").onclick=save;
  $("#discB").onclick=()=>{if(!dirty){toast("Nothing to discard");return}confirmBox("Discard unsaved changes?","Your edits since the last save will be lost.","Discard",()=>{draft=clone(saved);dirty=false;renderPanel();toast("Changes discarded")})};
  const all=CAT_GROUPS.flatMap(g=>g[1]);$("#catT").textContent=all.find(c=>c[0]===currentCat)[1];
  updStatus();
  const cnt=$("#cnt");
  if(currentCat==="account")return renderAccount(cnt);
  if(currentCat==="data")return renderData(cnt);
  const sc=SCHEMA[currentCat];
  cnt.innerHTML=`<p class="desc">${esc(sc.desc)}</p>`;
  for(const card of sc.cards){const el=document.createElement("div");el.className="card-a";el.innerHTML=`<h3>${esc(card.title)}</h3>`;card.fields.forEach(f=>el.appendChild(field(f,draft,"")));cnt.appendChild(el)}
}
async function save(){
  if(!dirty||saving)return;saving=true;updStatus();const b=$("#saveB");if(b)b.textContent="Saving…";
  try{contentSha=await putFile(cfg,token,"content.json",b64Text(JSON.stringify(draft,null,2)),"Update site content",contentSha);saved=clone(draft);dirty=false;toast("Saved to GitHub. The live site updates in about a minute")}
  catch(e){if(e.status===409||e.status===422){try{const f=await getFile(cfg,token,"content.json");contentSha=f&&f.sha;toast("Content changed on GitHub since you loaded it. Press Save again to replace it with your version")}catch(_){toast("Couldn't save: "+ghErr(e))}}
    else toast("Couldn't save: "+ghErr(e))}
  saving=false;if(b)b.textContent="Save & publish";updStatus();
}
function confirmBox(title,body,okLabel,onOk){const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h3 style="font-size:18px">${esc(title)}</h3><p style="color:var(--a-soft);font-size:14px">${esc(body)}</p><div class="row"><button class="abtn" type="button" data-x>Cancel</button><button class="abtn pri" type="button" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);m.querySelector("[data-x]").onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};m.querySelector("[data-ok]").onclick=()=>{m.remove();onOk()};m.querySelector("[data-ok]").focus()}

/* ============================================================
   ADMIN: field builders
   ============================================================ */
let fid=0;
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function field(f,obj,base){
  const path=base?base+"."+f.path:f.path;
  const id="f"+(++fid);
  const val=f.path?getP(obj,f.path):null;
  const set=v=>{setP(obj,f.path,v);markDirty()};
  switch(f.t){
    case "grid2":case "grid3":{const g=el(`<div class="${f.t}"></div>`);f.fields.forEach(x=>g.appendChild(field(x,obj,base)));return g}
    case "text":case "number":{const w=el(`<div class="f"><label for="${id}">${esc(f.label)}</label><input class="in" id="${id}" type="${f.t==="number"?"number":"text"}">${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`);
      const i=w.querySelector("input");i.value=val??"";i.oninput=()=>set(f.t==="number"?(+i.value||0):i.value);return w}
    case "textarea":{const w=el(`<div class="f"><label for="${id}">${esc(f.label)}</label><textarea class="ta" id="${id}" rows="${f.rows||3}"></textarea>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`);
      const i=w.querySelector("textarea");i.value=val??"";i.oninput=()=>set(i.value);return w}
    case "select":{const w=el(`<div class="f"><label for="${id}">${esc(f.label)}</label><select class="sel" id="${id}">${f.options.map(o=>`<option value="${esc(o)}">${esc(f.labels?f.labels[o]:o[0].toUpperCase()+o.slice(1))}</option>`).join("")}</select></div>`);
      const i=w.querySelector("select");i.value=val;i.onchange=()=>set(i.value);return w}
    case "toggle":{const w=el(`<label class="tog" for="${id}"><span>${esc(f.label)}</span><input type="checkbox" id="${id}"></label>`);
      const i=w.querySelector("input");i.checked=!!val;i.onchange=()=>{set(i.checked);if(currentCat==="layout")renderPanelKeep()};return w}
    case "range":{const w=el(`<div class="f"><label for="${id}">${esc(f.label)}</label><div class="rangef"><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step}"><output>${val}${f.unit||""}</output></div></div>`);
      const i=w.querySelector("input"),o=w.querySelector("output");i.value=val;i.oninput=()=>{set(+i.value);o.textContent=i.value+(f.unit||"")};return w}
    case "color":{const w=el(`<div class="f"><label for="${id}">${esc(f.label)}</label><div class="colorf"><input type="color" aria-label="${esc(f.label)} picker"><input class="in" id="${id}" maxlength="7" spellcheck="false"></div></div>`);
      const [p,t]=w.querySelectorAll("input");p.value=val;t.value=val;
      p.oninput=()=>{t.value=p.value;set(p.value)};t.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value)){p.value=t.value;set(t.value)}};return w}
    case "color-key":{const t=draft.theme;const w=el(`<div class="f"><span class="lb">${esc(f.label)}</span><div class="swatches" role="radiogroup" aria-label="${esc(f.label)}">${COLORS.map(([k,l])=>`<button type="button" class="sw${val===k?" on":""}" data-k="${k}" title="${l}" aria-label="${l}" style="background:${t[k]}"></button>`).join("")}</div></div>`);
      w.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{set(b.dataset.k);w.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b))});return w}
    case "shape":{const w=el(`<div class="f"><span class="lb">${esc(f.label)}</span><div class="shapes">${SHAPES.map(([k,l])=>`<button type="button" class="shpb${val===k?" on":""}" data-k="${k}" title="${l}" aria-label="${l}"><span class="shp ${k}" style="${k==="pill"?"width:26px;height:12px":k==="half"?"height:10px":""}"></span></button>`).join("")}</div></div>`);
      w.querySelectorAll(".shpb").forEach(b=>b.onclick=()=>{set(b.dataset.k);w.querySelectorAll(".shpb").forEach(x=>x.classList.toggle("on",x===b))});return w}
    case "image":return imageField(f,obj,id);
    case "strings":return stringsField(f,obj);
    case "list":return listField(f,obj,path);
    case "presets":{const w=el(`<div class="presets">${PRESETS.map((p,i)=>`<button class="preset" type="button" data-i="${i}"><span class="bar">${["bg","surface","c1","c2","c3","text"].map(k=>`<i style="background:${p.t[k]}"></i>`).join("")}</span>${esc(p.name)}</button>`).join("")}</div>`);
      w.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{Object.assign(draft.theme,PRESETS[+b.dataset.i].t);markDirty();renderPanelKeep();toast(PRESETS[+b.dataset.i].name+" applied. Preview or save to see it live")});return w}
  }
  return el("<div></div>");
}
function renderPanelKeep(){const y=scrollY;renderPanel();scrollTo(0,y)}
function imageField(f,obj,id){
  const val=getP(obj,f.path);
  const w=el(`<div class="f"><span class="lb">${esc(f.label)}</span><div class="imgf"><div class="thumb">${val?`<img src="${esc(imgUrl(val))}" alt="">`:"No image"}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="abtn sm" for="${id}" style="cursor:pointer">${val?"Replace":"Upload"} image</label><input type="file" id="${id}" accept="image/*" hidden>${val?'<button class="abtn sm danger" type="button" data-rm>Remove</button>':""}</div></div>
    <span class="hint">JPG, PNG, WebP or SVG, up to 5 MB. Saved to assets/uploads in your repository.</span></div>`);
  const inp=w.querySelector("input");
  inp.onchange=async()=>{const file=inp.files[0];if(!file)return;
    if(file.size>5*1024*1024){toast("That image is over 5 MB. Choose a smaller one.");return}
    const lb=w.querySelector("label.abtn");lb.textContent="Uploading…";
    try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(file)});
      const name=file.name.toLowerCase().replace(/[^a-z0-9.\-]+/g,"-").slice(-60);const path=`assets/uploads/${Date.now()}-${name}`;
      await putFile(cfg,token,path,b64,"Upload image "+name);localPreview[path]=URL.createObjectURL(file);
      setP(obj,f.path,{path});markDirty();renderPanelKeep();toast("Image uploaded to GitHub. Save to use it on the site")}
    catch(e){lb.textContent=(val?"Replace":"Upload")+" image";toast("Upload failed: "+ghErr(e))}};
  const rm=w.querySelector("[data-rm]");if(rm)rm.onclick=()=>{setP(obj,f.path,null);markDirty();renderPanelKeep()};
  return w;
}
function stringsField(f,obj){
  const arr=getP(obj,f.path)||[];
  const w=el(`<div class="f"><span class="lb">${esc(f.label)}</span><div class="strs"></div><button class="abtn sm" type="button" style="align-self:flex-start">+ ${esc(f.addLabel||"Add")}</button></div>`);
  const box=w.querySelector(".strs");
  arr.forEach((s,i)=>{const r=el(`<div class="r">${f.textarea?`<textarea class="ta" rows="2" style="min-height:56px" aria-label="${esc(f.label)} ${i+1}"></textarea>`:`<input class="in" aria-label="${esc(f.label)} ${i+1}">`}
    <button class="ib" type="button" title="Move up" aria-label="Move up" ${i?"":"disabled"}>↑</button><button class="ib del" type="button" title="Remove" aria-label="Remove">✕</button></div>`);
    const i2=r.querySelector("input,textarea");i2.value=s;i2.oninput=()=>{arr[i]=i2.value;markDirty()};
    const[up,del]=r.querySelectorAll("button");up.onclick=()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];markDirty();renderPanelKeep()};del.onclick=()=>{arr.splice(i,1);markDirty();renderPanelKeep()};box.appendChild(r)});
  w.querySelector(".abtn").onclick=()=>{arr.push("");setP(obj,f.path,arr);markDirty();renderPanelKeep()};
  return w;
}
function listField(f,obj,path){
  const arr=getP(obj,f.path)||[];
  const w=el(`<div class="f">${f.label?`<span class="lb">${esc(f.label)}</span>`:""}<div class="list"></div>${f.fixed||(f.max&&arr.length>=f.max)?"":`<button class="abtn sm" type="button" data-add style="align-self:flex-start">+ Add</button>`}</div>`);
  const box=w.querySelector(".list");
  arr.forEach((it,i)=>{const key=path+"#"+i;const li=el(`<div class="li${openItems.has(key)?" open":""}"><div class="li-h"><span class="chev">›</span><button class="ttl" type="button"></button>
      <button class="ib" type="button" title="Move up" aria-label="Move up" ${i?"":"disabled"}>↑</button><button class="ib" type="button" title="Move down" aria-label="Move down" ${i<arr.length-1?"":"disabled"}>↓</button>
      ${f.fixed?"":`<button class="ib del" type="button" title="Delete" aria-label="Delete">✕</button>`}</div><div class="li-b"></div></div>`);
    li.querySelector(".ttl").textContent=f.title(it,i)||"Untitled";
    li.querySelector(".ttl").onclick=()=>{li.classList.toggle("open");li.classList.contains("open")?openItems.add(key):openItems.delete(key)};
    const bs=li.querySelectorAll(".li-h .ib");
    bs[0].onclick=()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];swapOpen(path,i,i-1);markDirty();renderPanelKeep()};
    bs[1].onclick=()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];swapOpen(path,i,i+1);markDirty();renderPanelKeep()};
    if(bs[2])bs[2].onclick=()=>confirmBox("Delete this item?",`“${f.title(it,i)}” will be removed when you save.`,"Delete",()=>{arr.splice(i,1);openItems.clear();markDirty();renderPanelKeep()});
    const body=li.querySelector(".li-b");f.item.forEach(sf=>body.appendChild(field(sf,it,path+"."+i)));
    body.addEventListener("input",()=>li.querySelector(".ttl").textContent=f.title(it,i)||"Untitled");
    box.appendChild(li)});
  const add=w.querySelector("[data-add]");if(add)add.onclick=()=>{arr.push(clone(f.add));setP(obj,f.path,arr);openItems.add(path+"#"+(arr.length-1));markDirty();renderPanelKeep()};
  return w;
}
function swapOpen(p,a,b){const A=openItems.has(p+"#"+a),B=openItems.has(p+"#"+b);openItems.delete(p+"#"+a);openItems.delete(p+"#"+b);if(A)openItems.add(p+"#"+b);if(B)openItems.add(p+"#"+a)}

/* ============================================================
   ADMIN: account + data
   ============================================================ */
function renderAccount(cnt){
  cnt.innerHTML=`<p class="desc">Change your panel login or replace the GitHub token. Changes are saved to auth.json in your repository.</p>
  <div class="card-a"><h3>Login details</h3><form id="accF" class="list" autocomplete="off">
    <div class="f"><label for="au">Username</label><input class="in" id="au" required minlength="3" autocomplete="username"></div>
    <div class="grid2"><div class="f"><label for="ap">New password</label><input class="in" id="ap" type="password" autocomplete="new-password"><span class="hint">Leave empty to keep the current one.</span></div>
    <div class="f"><label for="ap2">Confirm new password</label><input class="in" id="ap2" type="password" autocomplete="new-password"></div></div>
    <div class="f"><label for="at">New GitHub token</label><input class="in" id="at" type="password" autocomplete="off" spellcheck="false"><span class="hint">Only needed when your token expires or you rotate it.</span></div>
    <div class="f"><label for="ac">Current password</label><input class="in" id="ac" type="password" required autocomplete="current-password"><span class="hint">Needed to confirm any change.</span></div>
    <p class="err" id="aerr"></p><button class="abtn pri" type="submit" style="align-self:flex-start">Update login</button></form></div>
  <div class="card-a"><h3>Repository</h3><p style="font-size:14px">Connected to <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b> on branch <b>${esc(cfg.branch)}</b>.</p>
    <a class="abtn sm" style="align-self:flex-start" href="https://github.com/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}" target="_blank" rel="noopener">Open on GitHub ↗</a></div>
  <div class="card-a"><h3>Session</h3><p style="color:var(--a-soft);font-size:14px">Signing out removes the token from this browser tab.</p><button class="abtn" id="outB" type="button" style="align-self:flex-start">Sign out</button></div>
  <div class="note"><b>How access works.</b> Saving needs your GitHub token, which is stored in auth.json encrypted with your password. Anyone can download that file and try to guess the password, so make it long and unique, and give the token access to this one repository only. If you ever suspect a leak, delete the token on GitHub and set up again.</div>`;
  $("#au").value=adminUser||"";
  $("#outB").onclick=signOut;
  $("#accF").onsubmit=async e=>{e.preventDefault();const er=$("#aerr"),u=$("#au").value.trim(),p=$("#ap").value,p2=$("#ap2").value,nt=$("#at").value.trim(),cur=$("#ac").value;er.textContent="";
    if(u.length<3){er.textContent="Username needs at least 3 characters.";return}
    if(p&&p.length<10){er.textContent="New password needs at least 10 characters.";return}
    if(p!==p2){er.textContent="The new passwords don't match.";return}
    const b=$("#accF button");b.disabled=true;b.textContent="Updating…";
    let ok=null;try{ok=await openAuth(cfg,cur)}catch(x){ok=null}
    if(!ok){er.textContent="Current password is incorrect.";b.disabled=false;b.textContent="Update login";return}
    try{const tok=nt||ok.token;if(nt)await api(cfg,nt,"");
      const a=await sealAuth(cfg,u,p||cur,tok);const f=await getFile(cfg,tok,"auth.json");
      await putFile(cfg,tok,"auth.json",b64Text(JSON.stringify(a,null,2)),"Update control panel login",f&&f.sha);
      cfg=a;token=tok;adminUser=u;keepSession();toast("Login updated");renderAccount(cnt)}
    catch(x){er.textContent=ghErr(x);b.disabled=false;b.textContent="Update login"}};
}
function renderData(cnt){
  cnt.innerHTML=`<p class="desc">Copy all content as a backup, restore from one, or start over with the original content.</p>
  <div class="card-a"><h3>Back up</h3><p style="color:var(--a-soft);font-size:14px">Copies everything in the editor, including unsaved changes, as text you can keep somewhere safe.</p><button class="abtn" id="cpB" type="button" style="align-self:flex-start">Copy content as JSON</button></div>
  <div class="card-a"><h3>Restore</h3><div class="f"><label for="imp">Paste a backup</label><textarea class="ta" id="imp" rows="6" spellcheck="false" style="font-family:'JetBrains Mono',monospace;font-size:12px"></textarea></div><p class="err" id="ierr"></p><button class="abtn" id="impB" type="button" style="align-self:flex-start">Load backup into editor</button></div>
  <div class="card-a"><h3>Reset</h3><p style="color:var(--a-soft);font-size:14px">Replaces everything in the editor with the original portfolio content. Nothing changes on the live site until you save.</p><button class="abtn danger" id="rsB" type="button" style="align-self:flex-start">Reset to original content</button></div>`;
  $("#cpB").onclick=()=>{const tx=JSON.stringify(draft,null,2);try{navigator.clipboard.writeText(tx).then(()=>toast("Backup copied"),()=>{$("#imp").value=tx;$("#imp").select();toast("Backup placed in the box below. Copy it from there")})}catch(e){$("#imp").value=tx;$("#imp").select()}};
  $("#impB").onclick=()=>{try{const v=JSON.parse($("#imp").value);if(!v||typeof v!=="object"||!v.theme)throw 0;draft=merge(DEFAULT,v);markDirty();toast("Backup loaded. Save to publish it");$("#ierr").textContent=""}catch(e){$("#ierr").textContent="That isn't a valid backup. Paste the full text copied from “Copy content as JSON”."}};
  $("#rsB").onclick=()=>confirmBox("Reset all content?","The editor will go back to the original portfolio. You can still discard before saving.","Reset",()=>{draft=clone(DEFAULT);markDirty();toast("Reset in editor. Save to publish")});
}

/* ============================================================
   BOOT
   ============================================================ */
route();
(async()=>{
  try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok){saved=merge(DEFAULT,await r.json());if(!dirty)draft=clone(saved);if(location.hash!=="#admin"&&!preview)renderSite(saved)}}catch(e){}
  try{const r=await fetch("auth.json",{cache:"no-store"});if(r.ok){const a=await r.json();if(a&&a.data&&a.salt)cfg=a}}catch(e){}
  authLoaded=true;restoreSession();
  if(location.hash==="#admin")route();else if(authed&&!preview)renderSite(saved);
})();
})();
</script>
